<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- Чистий title — без "Unity WebGL Player" -->
    <title>Frontier Heroes  Deck of Fate</title>

    <!-- Базовий viewport; JS-добивка нижче поставить його лише якщо відсутній -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover" />

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <style>
      /* Оверлей, що просить повернути телефон вертикально (включається JS-ом) */
      #orientation-overlay {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        background: #000; color: #fff; z-index: 9999;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 18px; text-align: center; padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas
        id="unity-canvas"
        width="1080"
        height="1920"
        tabindex="-1"
      ></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Frontier Heroes  Deck of Fate</div>
      </div>
    </div>

    <!-- Оверлей для ландшафтної орієнтації на мобільних (Android + iOS) -->
    <div id="orientation-overlay">Please turn your phone vertically 📱</div>

    <script>
      var container        = document.querySelector("#unity-container");
      var canvas           = document.querySelector("#unity-canvas");
      var loadingBar       = document.querySelector("#unity-loading-bar");
      var progressBarFull  = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner    = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/WebGl.loader.js";
      var config = {
        dataUrl:           buildUrl + "/WebGl.data.unityweb",
        frameworkUrl:      buildUrl + "/WebGl.framework.js.unityweb",
        codeUrl:           buildUrl + "/WebGl.wasm.unityweb",
        streamingAssetsUrl: buildUrl + "/StreamingAssets",
        companyName:        "AtomicPlayApps",
        productName:        "Frontier Heroes  Deck of Fate",
        productVersion:     "1.0.1",
        showBanner:         unityShowBanner,
      };

      // Mobile viewport + класи
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Додати meta viewport лише якщо його не вистачає (щоб уникнути дублю)
        if (!document.querySelector('meta[name="viewport"]')) {
          var meta = document.createElement("meta");
          meta.name    = "viewport";
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover";
          document.head.appendChild(meta);
        }
        container.className = "unity-mobile";
        canvas.className    = "unity-mobile";
      }


      // === Pause bridge helper ===
      function setPausedInUnity(paused) {
        if (window.unityInstance) {
          // GameObject name must be "PauseBridge", method accepts "1"/"0"
          window.unityInstance.SendMessage("PauseBridge", "SetPausedFromJS", paused ? "1" : "0");
        }
      }

      // === Helpers for platform/orientation ===
      function isMobile() { return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); }
      function isPortrait() { return window.innerHeight >= window.innerWidth; }

      // Портрет-лок (best-effort) — не заважає overlay-логіці
      function tryLockPortrait() {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(function(){});
        }
      }

      // Показ/приховування overlay + постановка/зняття паузи
      function updateOrientationOverlay() {
        var overlay = document.getElementById("orientation-overlay");
        var show = isMobile() && !isPortrait();
        overlay.style.display = show ? "flex" : "none";
        setPausedInUnity(show);
      }

      // Масштабування під екран (твоя логіка збережена)
      function resizeCanvas() {
        var maxWidth = window.innerWidth;
        var maxHeight = window.innerHeight;
        var gameAspect = 1080 / 1920;
        var screenAspect = maxWidth / maxHeight;

        var width, height;
        if (screenAspect > gameAspect) {
          // Екран ширший - підганяємо по висоті
          height = maxHeight;
          width = height * gameAspect;
        } else {
          // Екран вищий - підганяємо по ширині
          width = maxWidth;
          height = width / gameAspect;
        }
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
      }

      // Loader
      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";

          // Зберігаємо інстанс для SendMessage
          window.unityInstance = unityInstance;

          // Тільки назва гри у вкладці
          try { document.title = "Frontier Heroes  Deck of Fate"; } catch(e){}

          // Стартові виклики
          tryLockPortrait();
          resizeCanvas();
          updateOrientationOverlay();

          // Події
          window.addEventListener('resize', function(){
            resizeCanvas();
            updateOrientationOverlay();
          });
          window.addEventListener('orientationchange', function(){
            tryLockPortrait();
            resizeCanvas();
            updateOrientationOverlay();
          });

          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // Service Worker для офлайн-режиму
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function(err){
            console.log("SW registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
